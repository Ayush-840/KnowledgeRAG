# Render blueprint for the Knowledge RAG backend (FastAPI retrieval service).
#
# Deploy steps:
#   1. Commit and push this repo to GitHub.
#   2. In Render: New + -> Blueprint -> pick the repo -> Apply.
#      It auto-detects this render.yaml and provisions the web service + disk.
#   3. Persistent disks require a paid plan (Starter $7/mo + disk, ~$0.50/mo).
#   4. After it's live, note the service URL (https://<name>.onrender.com) and
#      set VITE_API_URL to it when deploying the React frontend to Vercel.
#
# NVIDIA_API_KEY supports multiple comma-separated keys for automatic rotation
# on 401/403/429 failures. Rotate keys in the Render dashboard as needed.
services:
  - type: web
    name: knowledge-rag-backend
    runtime: docker
    # rootDir is not used with runtime: docker — the root Dockerfile
    # builds the backend from backend/python/.
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CHROMA_PERSISTENCE_DIR
        value: /data/chroma
      - key: QUERY_LOG_DIR
        value: /data/logs
      - key: HF_HOME
        value: /data/hf-cache
      - key: RERANKER_ENABLED
        value: "false"
      # CORS locked to the deployed frontend origin; add other origins (e.g.
      # a localhost dev origin) as a comma-separated list if needed.
      - key: CORS_ORIGINS
        value: https://knowledge-rag-iota.vercel.app,https://knowledge-owi3od76f-ayush-840s-projects.vercel.app,http://localhost:5173
      # LLM provider for /chat answers (nvidia = free NIM tier with key rotation)
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        value: 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,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,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,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,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,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
    disk:
      name: rag-data
      mountPath: /data
      sizeGB: 2
